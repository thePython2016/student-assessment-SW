<h2 mat-dialog-title>Update Student</h2>

<mat-dialog-content class="dialog-content">
  <form class="student-form">

    <div class="form-row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>First Name</mat-label>
        <input matInput [(ngModel)]="student.firstName" name="firstName" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Last Name</mat-label>
        <input matInput [(ngModel)]="student.lastName" name="lastName" required>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="student.email" name="email" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Phone Number</mat-label>
        <input matInput type="tel" [(ngModel)]="student.phone" name="phone" required>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Course</mat-label>
      <input matInput [(ngModel)]="student.course" name="course" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Gender</mat-label>
      <mat-select [(ngModel)]="student.gender" name="gender" required>
        <mat-option *ngFor="let g of genders" [value]="g">{{ g }}</mat-option>
      </mat-select>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="onSave()">Save Changes</button>
</mat-dialog-actions>
