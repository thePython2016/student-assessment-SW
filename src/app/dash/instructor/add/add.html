<div class="page-header">
  <a mat-raised-button color="primary" routerLink="/dash/instructor/view" class="add-instructor-btn">
    <mat-icon>list</mat-icon> View Instructors
  </a>
</div>

<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>Add New Instructor</mat-card-title>
    <mat-card-subtitle>Fill in the instructor's details below</mat-card-subtitle>
  </mat-card-header>

  <mat-divider class="header-divider"></mat-divider>

  <mat-card-content>
    <form #instForm="ngForm"  (ngSubmit)="onSubmit(instForm)" class="instructor-form">

      <div class="form-row">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>First Name</mat-label>
          <input matInput [(ngModel)]="firstName" name="firstName" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Last Name</mat-label>
          <input matInput [(ngModel)]="lastName" name="lastName" required>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Email</mat-label>
         <input matInput type="email" [(ngModel)]="email" name="email" required (input)="error = ''">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Phone Number</mat-label>
          <input matInput type="tel" [(ngModel)]="phone" name="phone" required>
          <mat-icon matSuffix>phone</mat-icon>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Address</mat-label>
        <input matInput [(ngModel)]="address" name="address" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Department</mat-label>
        <mat-select [(ngModel)]="department" name="department" required>
          @for (d of departments; track d.id) {
            <mat-option [value]="d.id">{{ d.departmentName_ }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      @if (success) { <p class="success">{{ success }}</p> }
      @if (error) { <p class="error">{{ error }}</p> }

      <div class="form-actions">
        <button mat-stroked-button type="button">Cancel</button>
        <button mat-raised-button type="submit" class="submit-btn" [disabled]="instForm.invalid">
          <mat-icon>person_add</mat-icon> Add Instructor
        </button>
      </div>

    </form>
  </mat-card-content>
</mat-card>
