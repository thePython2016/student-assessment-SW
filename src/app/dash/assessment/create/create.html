<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>Create Assessment</mat-card-title>
    <mat-card-subtitle>Fill in the assessment details below</mat-card-subtitle>
  </mat-card-header>

  <mat-divider class="header-divider"></mat-divider>

  <mat-card-content>
    <form (ngSubmit)="onSubmit()" class="assessment-form">

      <div class="form-row">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Title</mat-label>
          <input matInput [(ngModel)]="title" name="title" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Type</mat-label>
          <mat-select [(ngModel)]="type" name="type" required>
            <mat-option *ngFor="let t of types" [value]="t">{{ t }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Course</mat-label>
        <mat-select [(ngModel)]="course" name="course" required>
          <mat-option *ngFor="let c of courses" [value]="c">{{ c }}</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="form-row">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Duration (minutes)</mat-label>
          <input matInput type="number" [(ngModel)]="duration" name="duration" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Total Marks</mat-label>
          <input matInput type="number" [(ngModel)]="totalMarks" name="totalMarks" required>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Deadline</mat-label>
          <input matInput [matDatepicker]="picker" [(ngModel)]="deadline" name="deadline" required>
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Number of Questions</mat-label>
          <input matInput type="number" [(ngModel)]="numberOfQuestions" name="numberOfQuestions" required>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-raised-button type="submit" color="primary" class="submit-btn">
          <mat-icon>add</mat-icon> Create Assessment
        </button>
      </div>

    </form>
  </mat-card-content>
</mat-card>
